name: Build msolve binary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libgmp-dev libmpfr-dev libflint-dev
      - name: Build msolve
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/algebraic-solving/msolve.git /tmp/msolve
          cd /tmp/msolve
          ./autogen.sh
          ./configure
          make -j2
          mkdir -p /tmp/msolve-artifact
          cp msolve /tmp/msolve-artifact/
          ldd msolve > /tmp/msolve-artifact/ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msolve-ubuntu-24.04
          path: /tmp/msolve-artifact
          retention-days: 30
